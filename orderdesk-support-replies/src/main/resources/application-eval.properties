# The evaluation runs once from the command line, so it needs no web server.
spring.main.web-application-type=none

# full       = score all articles, draft every ticket, write results.jsonl
# thresholds = read results.jsonl and print the threshold table (no model calls)
# summary    = read results.jsonl (and review.csv if present) and print the results table
orderdesk.eval.mode=full
orderdesk.eval.tickets=data/tickets.jsonl
orderdesk.eval.results=results.jsonl
orderdesk.eval.review=review.csv
# 0 = all tickets; set a small number for a quick smoke test
orderdesk.eval.limit=0
