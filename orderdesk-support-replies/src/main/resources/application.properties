spring.application.name=orderdesk-support-replies

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b
spring.ai.ollama.chat.temperature=0.2
spring.ai.ollama.chat.num-predict=512
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.retry.max-attempts=1
spring.http.clients.read-timeout=10m

orderdesk.replies.help-center=classpath:help-center/*.md
orderdesk.replies.article-base-url=https://help.orderdesk.example/articles/
orderdesk.replies.index-file=help-index.json
orderdesk.replies.similarity-threshold=0.55
orderdesk.replies.top-k=3
