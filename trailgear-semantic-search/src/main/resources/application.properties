spring.datasource.url=jdbc:postgresql://localhost:5432/trailgear
spring.datasource.username=trailgear
spring.sql.init.mode=always

spring.ai.model.chat=none
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text

trailgear.search.document-prefix=search_document:
trailgear.search.query-prefix=search_query:
trailgear.search.dimensions=768
trailgear.search.candidates=20
trailgear.search.rrf-k=60
